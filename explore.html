<script type="module">
import * as THREE from 'three';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const COL = { bg:0x0B0B0B, bone:0xF0EDE8, dim:0x8A8480, gold:0xC8A96E, blue:0x4A90D9, mag:0xE0349E, green:0x3CCB8E };
const clean = new URLSearchParams(location.search).has('clean');
if (clean) document.body.classList.add('clean');

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:false, powerPreference:'high-performance' });
renderer.setClearColor(COL.bg, 1);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07; controls.rotateSpeed = 0.8;
controls.autoRotate = true; controls.autoRotateSpeed = 0.7;
const C = new THREE.Vector3(0.5, 0.5, 0.5);   // cube centre
controls.target.copy(C);

let W=1, H=1;
const lineMats = [];
function resize(){
  W = stage.clientWidth || stage.offsetWidth || window.innerWidth;
  H = stage.clientHeight || stage.offsetHeight || window.innerHeight;
  renderer.setSize(W,H);
  camera.aspect = W/H; camera.updateProjectionMatrix();
  lineMats.forEach(m => m.resolution.set(W,H));
}
window.addEventListener('resize', resize);
if (window.ResizeObserver){ new ResizeObserver(()=>{ const w=stage.clientWidth,h=stage.clientHeight; if(w&&h&&(w!==W||h!==H)) resize(); }).observe(stage); }

const V = (x,y,z)=> new THREE.Vector3(x,y,z);
function colorFor(len){
  if (Math.abs(len-Math.SQRT2) < 0.03) return {c:COL.blue, w:3.6};
  if (Math.abs(len-Math.sqrt(3)) < 0.03) return {c:COL.mag, w:3.8};
  if (Math.abs(len-1) < 0.03) return {c:COL.bone, w:3.2};
  return {c:COL.dim, w:2.2};
}
function fatLine(a, b, parent){
  const g = new LineGeometry(); g.setPositions([a.x,a.y,a.z, b.x,b.y,b.z]);
  const cc = colorFor(a.distanceTo(b));
  const m = new LineMaterial({ color:cc.c, linewidth:cc.w, transparent:true, opacity:1 });
  m.resolution.set(W,H);
  const ln = new Line2(g, m); ln.computeLineDistances(); ln.frustumCulled=false;
  (parent||scene).add(ln); lineMats.push(m);
  return { line:ln, mat:m };
}
function triFill(a,b,c, color, parent){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute([a.x,a.y,a.z, b.x,b.y,b.z, c.x,c.y,c.z],3));
  const m = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0, side:THREE.DoubleSide, depthWrite:false });
  const mesh = new THREE.Mesh(g,m); mesh.renderOrder=-3; mesh.frustumCulled=false;
  (parent||scene).add(mesh);
  return m;
}

/* ---------- the six characteristic tetrahedra (orthoschemes) ----------
   Cube [0,1]^3, shared space diagonal O(0,0,0) -> G(1,1,1).
   Path O -> P1 (one axis) -> P2 (+ a second axis) -> G.
   Each piece's proof-triangle face = O,P2,G  (sides 1 : √2 : √3).               */
const O = V(0,0,0), G = V(1,1,1);
const axes = [V(1,0,0), V(0,1,0), V(0,0,1)];
const PIECES = [];
for (let i=0;i<3;i++) for (let j=0;j<3;j++){
  if (i===j) continue;
  const P1 = axes[i].clone();
  const P2 = axes[i].clone().add(axes[j]);
  PIECES.push([O.clone(), P1, P2, G.clone()]);
}
// piece edges (6) and the proof-triangle face (O,P2,G)
const EDGES = [[0,1],[1,2],[2,3],[0,2],[1,3],[0,3]];

const pieceGroups = [];
PIECES.forEach((vs, idx)=>{
  const grp = new THREE.Group(); scene.add(grp);
  const edges = EDGES.map(([a,b]) => fatLine(vs[a], vs[b], grp));
  // proof-triangle face green; the opposite face (O,P1,G) faint bone
  const proofFace = triFill(vs[0], vs[2], vs[3], COL.green, grp);
  const backFace  = triFill(vs[0], vs[1], vs[3], COL.bone, grp);
  const centroid = vs.reduce((s,p)=>s.clone? s.clone().add(p):s.add(p)).multiplyScalar(0.25);
  const dir = centroid.clone().sub(C).normalize();
  grp.userData = { edges, proofFace, backFace, dir, start: idx*0.045 };
  pieceGroups.push(grp);
});

/* ---------- mirror / array cells (face-adjacent ±X ±Y ±Z) ---------- */
function makeMirrorCell(ci,cj,ck){
  function ct(p){
    let x=p.x,y=p.y,z=p.z;
    if(Math.abs(ci)%2===1) x=1-x;
    if(Math.abs(cj)%2===1) y=1-y;
    if(Math.abs(ck)%2===1) z=1-z;
    return V(x+ci,y+cj,z+ck);
  }
  const cc=V(ci+0.5,cj+0.5,ck+0.5);
  const groups=[];
  PIECES.forEach(vs=>{
    const rv=vs.map(p=>ct(p));
    const grp=new THREE.Group(); scene.add(grp);
    const edges=EDGES.map(([a,b])=>fatLine(rv[a],rv[b],grp));
    const proofFace=triFill(rv[0],rv[2],rv[3],COL.green,grp);
    const backFace =triFill(rv[0],rv[1],rv[3],COL.bone,grp);
    const cen=rv.reduce((s,p)=>s.clone().add(p)).multiplyScalar(0.25);
    const dir=cen.clone().sub(cc).normalize();
    grp.userData={edges,proofFace,backFace,dir};
    grp.visible=false;
    groups.push(grp);
  });
  return {ci,cj,ck,groups};
}
/* ---------- per-axis array pool (up to 5 cells per direction = 30 total) ---------- */
const AXIS_DIRS = [
  {key:'xPos',ci:1,cj:0,ck:0},{key:'xNeg',ci:-1,cj:0,ck:0},
  {key:'yPos',ci:0,cj:1,ck:0},{key:'yNeg',ci:0,cj:-1,ck:0},
  {key:'zPos',ci:0,cj:0,ck:1},{key:'zNeg',ci:0,cj:0,ck:-1},
];
const MAX_ARRAY = 5;
const arrayPool = [];
AXIS_DIRS.forEach(d=>{
  for(let n=1;n<=MAX_ARRAY;n++){
    const {groups} = makeMirrorCell(d.ci*n, d.cj*n, d.ck*n);
    arrayPool.push({key:d.key, dist:n, groups});
  }
});

/* ---------- the assembled cube outline (12 edges, bone) ---------- */
const cubeGroup = new THREE.Group(); scene.add(cubeGroup);
function cubeEdges(origin, parent, fat){
  const c = [];
  for (let x=0;x<2;x++) for (let y=0;y<2;y++) for (let z=0;z<2;z++) c.push(V(origin.x+x, origin.y+y, origin.z+z));
  const E = [[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  const out = [];
  E.forEach(([a,b])=>{
    if (fat){ out.push(fatLine(c[a], c[b], parent).mat); }
  });
  return out;
}
const cubeOutlineMats = cubeEdges(V(0,0,0), cubeGroup, true);

/* ---------- neighbour cubes (space-filling), thin & faint ---------- */
const fillGroup = new THREE.Group(); scene.add(fillGroup);
const neighbours = [];
const cubeSeg = (() => { // 12-edge index list for LineSegments
  const c=[]; for (let x=0;x<2;x++) for(let y=0;y<2;y++) for(let z=0;z<2;z++) c.push([x,y,z]);
  const E=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  return {c,E};
})();
for (let i=-2;i<=2;i++) for (let j=-2;j<=2;j++) for (let k=-2;k<=2;k++){
  if (i===0 && j===0 && k===0) continue;
  const pos=[];
  cubeSeg.E.forEach(([a,b])=>{
    const A=cubeSeg.c[a], B=cubeSeg.c[b];
    pos.push(A[0]+i,A[1]+j,A[2]+k, B[0]+i,B[1]+j,B[2]+k);
  });
  const g=new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  const m=new THREE.LineBasicMaterial({ color:COL.bone, transparent:true, opacity:0 });
  const ls=new THREE.LineSegments(g,m); ls.frustumCulled=false; fillGroup.add(ls);
  neighbours.push({ mat:m, dist:Math.max(Math.abs(i),Math.abs(j),Math.abs(k)) });
}

/* ---------- angle / length labels (toggleable) ---------- */
function labelSprite(text, hex){
  const font='700 92px "Space Mono", monospace';
  const meas=document.createElement('canvas').getContext('2d'); meas.font=font;
  const pad=18, w=Math.ceil(meas.measureText(text).width)+pad*2, h=128;
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); x.font=font; x.textBaseline='middle'; x.textAlign='center';
  x.fillStyle='rgba(11,11,11,0.66)'; const r=12;
  x.beginPath(); x.moveTo(r,6); x.arcTo(w-2,6,w-2,h-6,r); x.arcTo(w-2,h-6,2,h-6,r); x.arcTo(2,h-6,2,6,r); x.arcTo(2,6,w-2,6,r); x.fill();
  x.fillStyle=hex; x.fillText(text, w/2, h/2+4);
  const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,opacity:0,depthWrite:false,depthTest:false}));
  sp.scale.set(0.16*w/h, 0.16, 1); sp.renderOrder=30;
  return sp;
}
const HEX={bone:'#F0EDE8',blue:'#4A90D9',mag:'#E0349E',gold:'#C8A96E'};
const labels=[];
function addLabel(text,hex,pos){ const sp=labelSprite(text,hex); sp.position.copy(pos); cubeGroup.add(sp); labels.push(sp); }
addLabel('1',     HEX.bone, V(0.5,-0.04,-0.06));
addLabel('√2',    HEX.blue, V(0.5,0.5,-0.10));
addLabel('√3',    HEX.mag,  V(0.66,0.52,0.5));
addLabel('35.26°', HEX.gold, V(0.30,0.12,0.24));

/* ---------- captions ---------- */
const capStack = document.getElementById('capstack');
function cap(html){ const d=document.createElement('div'); d.className='cap'; d.innerHTML=html; capStack.appendChild(d); return d; }
const CAPS = [
  { el: cap('One part · the <b>proof triangle</b>, stood up in space') },
  { el: cap('Add the parts · each shares the <b>space diagonal · √3</b>') },
  { el: cap('Six parts close into <b>one cube</b>') },
  { el: cap('Pull it apart · six identical parts, every face a <b>√2 fold</b>') },
  { el: cap('One module → <b>the whole of space</b>') },
  { el: cap('Mirror across every face · each neighbor <b>the same six parts, reflected</b>') },
];

/* ---------- camera framing ---------- */
function frame(radius){
  const dist = radius / Math.sin((camera.fov*Math.PI/180)/2);
  camera.near = dist/100; camera.far = dist*20; camera.updateProjectionMatrix();
  return dist;
}
let baseDist = frame(1.05);
// place camera once
camera.position.copy(C).add(new THREE.Vector3(0.62,0.5,0.86).normalize().multiplyScalar(baseDist));
controls.update();

/* ---------- interactive state ---------- */
const easeIO = x => x<0.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const clamp01 = x => Math.max(0, Math.min(1, x));
const FLY = 1.9, EXPLODE_MAX = 1.5;
const STATE = { parts:0, explode:0, space:0, faces:1, angles:0, arrayFade:0, xPos:0, xNeg:0, yPos:0, yNeg:0, zPos:0, zNeg:0 };
const AXIS_IDS = [{key:'xPos',id:'xpos'},{key:'xNeg',id:'xneg'},{key:'yPos',id:'ypos'},{key:'yNeg',id:'yneg'},{key:'zPos',id:'zpos'},{key:'zNeg',id:'zneg'}];

let userTookOver = false;
controls.addEventListener('start', ()=>{ userTookOver = true; controls.autoRotate = false; syncToggles(); });

const scrub = document.getElementById('scrub');
const tlabel = document.getElementById('tlabel');
const playBtn = document.getElementById('play');
const speedSel = document.getElementById('speed');
const sParts = document.getElementById('s-parts');
const sExplode = document.getElementById('s-explode');
const sSpace = document.getElementById('s-space');
const vParts = document.getElementById('v-parts');
const vExplode = document.getElementById('v-explode');
const vSpace = document.getElementById('v-space');
const tgFaces = document.getElementById('tg-faces');
const tgAngles = document.getElementById('tg-angles');
const tgSpin = document.getElementById('tg-spin');
const sAfade = document.getElementById('s-afade');
const vAfade = document.getElementById('v-afade');

function render(){
  pieceGroups.forEach((g,i)=>{
    const u = g.userData;
    const local = clamp01(STATE.parts - i);                 // arrival of part i (0..1)
    const e = easeIO(local);
    const off = (1-e)*FLY + STATE.explode*EXPLODE_MAX*e;     // fly-in remaining + manual explode
    g.position.copy(u.dir).multiplyScalar(off);
    g.visible = local > 0.001;
    u.edges.forEach(ed=> ed.mat.opacity = 0.96*local);
    const faceFade = 1 - clamp01(STATE.space/2)*0.45;
    u.proofFace.opacity = (STATE.faces?0.20:0)*local*faceFade;
    u.backFace.opacity  = (STATE.faces?0.06:0)*local;
  });
  const cubeOp = clamp01((STATE.parts - 5.4)/0.6);
  cubeOutlineMats.forEach(m=> m.opacity = 0.5*cubeOp);
  labels.forEach(l=> l.material.opacity = STATE.angles ? 0.95*cubeOp : 0);
  neighbours.forEach(n=>{
    const reveal = clamp01(STATE.space - (n.dist-1));
    n.mat.opacity = 0.14*(n.dist===1?1:0.6)*easeIO(reveal)*cubeOp;
  });
  // per-axis array cells
  const aFade = easeIO(clamp01(STATE.arrayFade)) * cubeOp;
  arrayPool.forEach(({key,dist,groups})=>{
    const count = STATE[key]||0;
    const mop = dist<=count ? aFade : 0;
    groups.forEach((g,idx)=>{
      const local=clamp01(STATE.parts-idx);
      const e=easeIO(local);
      const off=(1-e)*FLY+STATE.explode*EXPLODE_MAX*e;
      g.visible=local>0.001&&mop>0.001;
      if(g.visible){
        g.position.copy(g.userData.dir).multiplyScalar(off);
        g.userData.edges.forEach(ed=>ed.mat.opacity=0.60*mop*local);
        g.userData.proofFace.opacity=(STATE.faces?0.13:0)*mop*local;
        g.userData.backFace.opacity =(STATE.faces?0.04:0)*mop*local;
      }
    });
  });
  updateCaption();
}
function updateCaption(){
  let idx = 0;
  if (STATE.space > 0.04) idx = 4;
  else if (STATE.arrayFade>0.05&&(STATE.xPos+STATE.xNeg+STATE.yPos+STATE.yNeg+STATE.zPos+STATE.zNeg)>0) idx = 5;
  else if (STATE.explode > 0.05) idx = 3;
  else if (STATE.parts >= 5.85) idx = 2;
  else if (STATE.parts >= 1.4) idx = 1;
  CAPS.forEach((c,i)=> c.el.style.opacity = (i===idx)?1:0);
}
function syncToggles(){
  tgFaces.classList.toggle('off', !STATE.faces);
  tgAngles.classList.toggle('off', !STATE.angles);
  tgSpin.classList.toggle('off', !controls.autoRotate);
  tgFaces.setAttribute('aria-pressed', String(!!STATE.faces));
  tgAngles.setAttribute('aria-pressed', String(!!STATE.angles));
  tgSpin.setAttribute('aria-pressed', String(!!controls.autoRotate));

}
function syncSliders(){
  sParts.value = STATE.parts;   vParts.textContent = Math.round(STATE.parts)+' / 6';
  sExplode.value = STATE.explode; vExplode.textContent = Math.round(STATE.explode*100)+'%';
  sSpace.value = STATE.space;   vSpace.textContent = STATE.space<0.04 ? '1³' : (STATE.space<=1.02 ? '3³' : '5³');
  sAfade.value=STATE.arrayFade; vAfade.textContent=Math.round(STATE.arrayFade*100)+'%';
  AXIS_IDS.forEach(({key,id})=>{ const s=document.getElementById('s-'+id),v=document.getElementById('v-'+id); if(s)s.value=STATE[key]; if(v)v.textContent=STATE[key]; });
  syncToggles();
}

/* ---------- guided tour (scrubbable) ---------- */
function tourState(tt){
  const parts = Math.min(6, (tt/0.40)*6);
  let explode = 0;
  if (tt>0.52 && tt<0.68) explode = Math.sin((tt-0.52)/0.16*Math.PI)*0.80;
  const inArr = tt>=0.68 && tt<0.88;
  const arrayFade = inArr ? clamp01((tt-0.68)/0.10)*(tt>0.82?clamp01(1-(tt-0.82)/0.06):1) : 0;
  const cnt = inArr ? 1 : 0;
  const space = tt>0.88 ? clamp01((tt-0.88)/0.12)*2 : 0;
  const angles = (tt>0.42 && tt<0.66) ? 1 : 0;
  return { parts, explode, space, faces:1, angles, arrayFade, xPos:cnt,xNeg:cnt,yPos:cnt,yNeg:cnt,zPos:cnt,zNeg:cnt };
}
let tt = 0, playing = true, speed = 1, last = performance.now();
const DURATION = 26; // seconds at 1x — the unhurried tour
function setPlaying(p){ playing = p; playBtn.textContent = p ? '❙❙ Pause' : '► Play'; }
function setTour(v){ tt = clamp01(v); Object.assign(STATE, tourState(tt));
  scrub.value = Math.round(tt*1000); tlabel.textContent = Math.round(tt*100)+'%'; render(); syncSliders(); }

playBtn.onclick = ()=> setPlaying(!playing);
speedSel.onchange = ()=> speed = parseFloat(speedSel.value);
scrub.oninput = ()=>{ setPlaying(false); setTour(scrub.value/1000); };
document.getElementById('replay').onclick = ()=>{
  userTookOver = false; controls.autoRotate = true; controls.target.copy(C);
  baseDist = frame(1.05);
  camera.position.copy(C).add(new THREE.Vector3(0.62,0.5,0.86).normalize().multiplyScalar(baseDist));
  STATE.arrayFade=0; STATE.xPos=0; STATE.xNeg=0; STATE.yPos=0; STATE.yNeg=0; STATE.zPos=0; STATE.zNeg=0;
  setTour(0); setPlaying(true);
};

/* ---------- manual controls ---------- */
function manual(){ if (playing) setPlaying(false); }
sParts.oninput   = ()=>{ manual(); STATE.parts=parseFloat(sParts.value);   vParts.textContent=Math.round(STATE.parts)+' / 6'; render(); };
sExplode.oninput = ()=>{ manual(); STATE.explode=parseFloat(sExplode.value); vExplode.textContent=Math.round(STATE.explode*100)+'%'; render(); };
sSpace.oninput   = ()=>{ manual(); STATE.space=parseFloat(sSpace.value);   vSpace.textContent=STATE.space<0.04?'1³':(STATE.space<=1.02?'3³':'5³'); render(); };
sAfade.oninput = ()=>{ manual(); STATE.arrayFade=parseFloat(sAfade.value); vAfade.textContent=Math.round(STATE.arrayFade*100)+'%'; render(); };
AXIS_IDS.forEach(({key,id})=>{
  const sl=document.getElementById('s-'+id), vl=document.getElementById('v-'+id);
  sl.oninput=()=>{ manual(); STATE[key]=parseInt(sl.value); vl.textContent=sl.value; render(); };
});
document.getElementById('btn-cleararray').onclick=()=>{ manual(); AXIS_IDS.forEach(({key})=>STATE[key]=0); STATE.arrayFade=0; syncSliders(); render(); };
tgFaces.onclick  = ()=>{ manual(); STATE.faces = STATE.faces?0:1; syncToggles(); render(); };
tgAngles.onclick = ()=>{ manual(); STATE.angles = STATE.angles?0:1; syncToggles(); render(); };
tgSpin.onclick   = ()=>{ controls.autoRotate = !controls.autoRotate; if(controls.autoRotate) userTookOver=false; syncToggles(); };

setTour(0);
resize();
render();
renderer.render(scene, camera);   // guaranteed first paint

function animate(now){
  const w = stage.clientWidth, h = stage.clientHeight;
  if (w && h && (w!==W || h!==H)) resize();
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (playing){
    tt += dt * speed / DURATION;
    if (tt >= 1){ tt = 1; setPlaying(false); }
    Object.assign(STATE, tourState(tt));
    scrub.value = Math.round(tt*1000); tlabel.textContent = Math.round(tt*100)+'%';
    render(); syncSliders();
  }
  if (!userTookOver){   // gently dolly out as space / mirror fills
    const maxArr = Math.max(STATE.xPos,STATE.xNeg,STATE.yPos,STATE.yNeg,STATE.zPos,STATE.zNeg);
    const arrayPush = 0.52*easeIO(clamp01(maxArr/3))*easeIO(clamp01(STATE.arrayFade));
    const desired = baseDist * (1 + 0.95*easeIO(clamp01(STATE.space/2)) + arrayPush);
    const dir = camera.position.clone().sub(C); const cur = dir.length();
    if (cur > 1e-3){ const nd = cur + (desired-cur)*Math.min(1, dt*3); camera.position.copy(C).add(dir.multiplyScalar(nd/cur)); }
  }
  if (W>1 && H>1){ controls.update(); renderer.render(scene, camera); }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.__view = { scene, camera, controls, renderer, STATE, render, setTour, tourState, pause:()=>setPlaying(false), set:(o)=>{ setPlaying(false); Object.assign(STATE,o); render(); syncSliders(); } };
</script>


</body></html>
